d settlement data</text></g><g><rect x="40" y="365" width="300" height="88" rx="12" fill="#ffffff" stroke="#d6dfeb" stroke-width="1.3"/><text x="58" y="396" font-size="23" font-weight="700" fill="#223650">Verification</text><text x="58" y="421" font-size="17" fill="#5e6f86">Claim vs observed outcome</text></g><g><rect x="40" y="525" width="300" height="88" rx="12" fill="#ffffff" stroke="#d6dfeb" stroke-width="1.3"/><text x="58" y="556" font-size="23" font-weight="700" fill="#223650">Reputation</text><text x="58" y="581" font-size="17" fill="#5e6f86">Verified outcome history</text></g></g></svg>
