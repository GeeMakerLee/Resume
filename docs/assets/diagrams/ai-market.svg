<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="660" viewBox="0 0 1160 660" role="img" aria-labelledby="title description"><g font-family="Arial,DejaVu Sans,sans-serif"><title id="title">AI Market Intelligence</title><desc id="description">Evidence → Event → Forecast → Verification → Reputation</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#6d7e99"/></marker><marker id="accent-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f7d"/></marker></defs><rect x="1" y="1" width="1158" height="658" rx="22" fill="#f8fafc" stroke="#dce4ee"/><rect x="40" y="38" width="5" height="50" rx="2" fill="#087f7d"/><text x="60" y="62" font-size="30" font-weight="700" fill="#15273f">AI Market Intelligence</text><text x="60" y="95" font-size="19" fill="#66768d">Evidence → Event → Forecast → Verification → Reputation</text><text x="40" y="633" font-size="18" fill="#66768d">Time boundaries protect the evidence set; settlement gates protect outcome verification.</text><polyline points="340,219 430,219" fill="none" stroke="#6d7e99" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="730,219 820,219" fill="none" stroke="#087f7d" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#accent-arrow)"/><text x="775" y="197" font-size="17" fill="#087f7d" text-anchor="middle" paint-order="stroke" stroke="#f8fafc" stroke-width="9" stroke-linejoin="round">Accepted</text><polyline points="970,263 970,365" fill="none" stroke="#6d7e99" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="820,409 730,409" fill="none" stroke="#6d7e99" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="430,409 340,409" fill="none" stroke="#087f7d" stroke-width="2.4" stroke-linejoin="round" marke