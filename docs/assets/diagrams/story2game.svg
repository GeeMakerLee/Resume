<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="660" viewBox="0 0 1160 660" role="img" aria-labelledby="title description"><g font-family="Arial,DejaVu Sans,sans-serif"><title id="title">Story2Game</title><desc id="description">Constrained generation, deterministic verification and recoverable execution</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#6d7e99"/></marker><marker id="accent-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#3154d6"/></marker></defs><rect x="1" y="1" width="1158" height="658" rx="22" fill="#f8fafc" stroke="#dce4ee"/><rect x="40" y="38" width="5" height="50" rx="2" fill="#3154d6"/><text x="60" y="62" font-size="30" font-weight="700" fill="#15273f">Story2Game</text><text x="60" y="95" font-size="19" fill="#66768d">Constrained generation, deterministic verification and recoverable execution</text><text x="40" y="633" font-size="18" fill="#66768d">Verification is the acceptance gate. Recovery feeds back into compilation and verification.</text><polyline points="240,224 310,224" fill="none" stroke="#6d7e99" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="535,224 605,224" fill="none" stroke="#6d7e99" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="830,224 900,224" fill="none" stroke="#6d7e99" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1010,268 1010,405" fill="none" stroke="#3154d6" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#accent-arrow)"/><text x="1040" y="345" font-size="17" fill="#3154d6" text-anchor="middle" paint-order="stroke" stroke="#f8fafc" stroke-width="9" stroke-linejoin="round">Pass</text><polyline points="945,268 945,330 718,330 718,405" fill="none" stroke="#6d7e99" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="820" y="320" font-size="17" fill="#5e6f86" text-anchor="middle" paint-order="stroke" stroke="#f8fafc" stroke-width="9" stroke-linejoin="round">Fail</text><polyline points="605,449 568,449 568,295 678,295 678,268" fill="none" stroke="#3154d6" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#accent-arrow)" stroke-dasharray="7 5"/><text x="718" y="307" font-size="17" fill="#3154d6" text-anchor="middle" paint-order="stroke" stroke="#f8fafc" stroke-width="9" stroke-linejoin="round">Recompile + re-verify</text><polyline points="605,449 535,449" fill="none" stroke="#6d7e99" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="569" y="526" font-size="17" fill="#5e6f86" text-anchor="middle" paint-order="stroke" stroke="#f8fafc" stroke-width="9" stroke-linejoin="round">Repair budget exceeded</text><polyline points="423,405 423,268" fill="none" stroke="#3154d6" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#accent-arrow)" stroke-dasharray="7 5"/><text x="470" y="345" font-size="17" fill="#3154d6" text-anchor="middle" paint-order="stroke" stroke="#f8fafc" stroke-width="9" stroke-linejoin="round">New plan</text><g><rect x="40" y="180" width="200" height="88" rx="12" fill="#ffffff" stroke="#d6dfeb" stroke-width="1.3"/><text x="58" y="211" font-size="23" font-weight="700" fill="#223650">Story</text><text x="58" y="236" font-size="17" fill="#5e6f86">Story input</text></g><g><rect x="310" y="180" width="225" height="88" rx="12" fill="#ffffff" stroke="#d6dfeb" stroke-width="1.3"/><text x="328" y="211" font-size="23" font-weight="700" fill="#223650">GamePlan/DSL</text><text x="328" y="236" font-size="17" fill="#5e6f86">Structured game rules</text><text x="328" y="257" font-size="17" fill="#5e6f86">Constrained output</text></g><g><rect x="605" y="180" width="225" height="88" rx="12" fill="#ffffff" stroke="#d6dfeb" stroke-width="1.3"/><text x="623" y="211" font-size="23" font-weight="700" fill="#223650">Compiler</text><text x="623" y="236" font-size="17" fill="#5e6f86">DSL → execution</text></g><g><rect x="900" y="180" width="220" height="88" rx="12" fill="#ecf1ff" stroke="#3154d6" stroke-width="1.8"/><text x="918" y="211" font-size="23" font-weight="700" fill="#3154d6">Verifier</text><text x="918" y="236" font-size="17" fill="#5e6f86">Rules + state checks</text></g><g><rect x="900" y="405" width="220" height="88" rx="12" fill="#ecf1ff" stroke="#3154d6" stroke-width="1.8"/><text x="918" y="436" font-size="23" font-weight="700" fill="#3154d6">Runtime</text><text x="918" y="461" font-size="17" fill="#5e6f86">Phaser 2D interaction</text></g><g><rect x="605" y="405" width="225" height="88" rx="12" fill="#ffffff" stroke="#d6dfeb" stroke-width="1.3"/><text x="623" y="436" font-size="23" font-weight="700" fill="#223650">Repair</text><text x="623" y="461" font-size="17" fill="#5e6f86">Validation feedback</text></g><g><rect x="310" y="405" width="225" height="88" rx="12" fill="#ffffff" stroke="#d6dfeb" stroke-width="1.3"/><text x="328" y="436" font-size="23" font-weight="700" fill="#223650">Regenerate</text><text x="328" y="461" font-size="17" fill="#5e6f86">Retry from the plan</text></g></g></svg>
