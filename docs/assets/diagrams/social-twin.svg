<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="660" viewBox="0 0 1160 660" role="img" aria-labelledby="title description"><g font-family="Arial,DejaVu Sans,sans-serif"><title id="title">AI Social Twin</title><desc id="description">Identity, memory and relationship as separate inputs to personalized dialogue</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#6d7e99"/></marker><marker id="accent-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#7752c4"/></marker></defs><rect x="1" y="1" width="1158" height="658" rx="22" fill="#f8fafc" stroke="#dce4ee"/><rect x="40" y="38" width="5" height="50" rx="2" fill="#7752c4"/><text x="60" y="62" font-size="30" font-weight="700" fill="#15273f">AI Social Twin</text><text x="60" y="95" font-size="19" fill="#66768d">Identity, memory and relationship as separate inputs to personalized dialogue</text><text x="40" y="633" font-size="18" fill="#66768d">Checkpoints support batch recovery. Evaluation separates profile, memory and relationship effects.</text><polyline points="280,214 355,214" fill="none" stroke="#6d7e99" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="465,258 465,335" fill="none" stroke="#6d7e99" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="580,258 580,294 760,294 760,335" fill="none" stroke="#6d7e99" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="465,423 465,549 635,549" fill="none" stroke="#6d7e99" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="760,423 760,505" fill="none" stroke="#6d7e99" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="280,549 635,549" fill="none" stroke="#7752c4" stroke-width="2.4" stroke-l