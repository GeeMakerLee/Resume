<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="660" viewBox="0 0 1160 660" role="img" aria-labelledby="title description"><g font-family="Arial,DejaVu Sans,sans-serif"><title id="title">Visual CEP Rule Builder</title><desc id="description">Make expert-authored rules understandable and executable</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#6d7e99"/></marker><marker id="accent-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#47627e"/></marker></defs><rect x="1" y="1" width="1158" height="658" rx="22" fill="#f8fafc" stroke="#dce4ee"/><rect x="40" y="38" width="5" height="50" rx="2" fill="#47627e"/><text x="60" y="62" font-size="30" font-weight="700" fill="#15273f">Visual CEP Rule Builder</text><text x="60" y="95" font-size="19" fill="#66768d">Make expert-authored rules understandable and executable</text><text x="40" y="633" font-size="18" fill="#66768d">Validation prevents invalid rule combinations; explanation helps domain experts check their intent.</text><polyline points="325,224 435,224" fill="none" stroke="#6d7e99" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="720,224 830,224" fill="none" stroke="#6d7e99" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="975,268 975,410" fill="none" stroke="#47627e" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#accent-arrow)"/><text x="1012" y="345" font-size="17" fill="#47627e" text-anchor="middle" paint-order="stroke" stroke="#f8fafc" stroke-width="9" stroke-linejoin="round">Valid</text><polyline points="830,454 720,454" fill="none" stroke="#47627e" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#accent-arrow)"/><text x="775" y="434" font-size="17" fill="#47627e" text-anchor="middle" paint-order="stroke" stroke="#f8fafc" stroke-width="9" stroke-linejoin="round">Generate</text><polyline points="880,268 880,310 183,310 183,268" fill="none" stroke="#6d7e99" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="535" y="303" font-size="17" fill="#5e6f86" text-anchor="middle" paint-order="stroke" stroke="#f8fafc" stroke-width="9" stroke-linejoin="round">Invalid: explain and revise</text><g><rect x="40" y="180" width="285" height="88" rx="12" fill="#ffffff" stroke="#d6dfeb" stroke-width="1.3"/><text x="58" y="211" font-size="23" font-weight="700" fill="#223650">RuleGraph</text><text x="58" y="236" font-size="17" fill="#5e6f86">Predicates + logic + time</text><text x="58" y="257" font-size="17" fill="#5e6f86">Visual authoring</text></g><g><rect x="435" y="180" width="285" height="88" rx="12" fill="#ffffff" stroke="#d6dfeb" stroke-width="1.3"/><text x="453" y="211" font-size="23" font-weight="700" fill="#223650">Typed AST</text><text x="453" y="236" font-size="17" fill="#5e6f86">Topological reconstruction</text><text x="453" y="257" font-size="17" fill="#5e6f86">Typed rule representation</text></g><g><rect x="830" y="180" width="290" height="88" rx="12" fill="#edf2f6" stroke="#47627e" stroke-width="1.8"/><text x="848" y="211" font-size="23" font-weight="700" fill="#47627e">Constraint checks</text><text x="848" y="236" font-size="17" fill="#5e6f86">Arity + parameters + time</text></g><g><rect x="830" y="410" width="290" height="88" rx="12" fill="#ffffff" stroke="#d6dfeb" stroke-width="1.3"/><text x="848" y="441" font-size="23" font-weight="700" fill="#223650">NL explanation</text><text x="848" y="466" font-size="17" fill="#5e6f86">Confirm the rule intent</text></g><g><rect x="435" y="410" width="285" height="88" rx="12" fill="#edf2f6" stroke="#47627e" stroke-width="1.8"/><text x="453" y="441" font-size="23" font-weight="700" fill="#47627e">Executable output</text><text x="453" y="466" font-size="17" fill="#5e6f86">StreamSQL / Flink CEP</text></g></g></svg>
